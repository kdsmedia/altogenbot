packages:
  "framer-motion": "For page transitions, list staggering, and polished micro-interactions"
  "recharts": "For the analytics area chart on the dashboard"
  "date-fns": "For formatting transaction and user creation dates"
  "clsx": "Utility for constructing CSS classes conditionally"
  "tailwind-merge": "Utility for merging tailwind classes without style conflicts"

images:
  - path: "artifacts/admin-panel/public/images/login-bg.png"
    description: "Abstract 3D gradient mesh in deep obsidian, neon violet, and cyan. Very professional tech-startup feel with subtle glowing light leaks and glassmorphism elements."
    aspect_ratio: "16:9"
  - path: "artifacts/admin-panel/public/images/logo.png"
    description: "Minimal futuristic geometric logo mark for ALTOGEN, rendered in bright glowing cyan and purple against a transparent background."
    aspect_ratio: "1:1"

notes:
  - All `@workspace/api-client-react` generated hooks support `request?: RequestInit` options.
  - The frontend manages authentication by injecting the auth token into headers via an interceptor pattern or passing it to the hook's request parameter.
