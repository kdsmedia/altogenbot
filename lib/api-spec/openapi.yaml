openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ALTOGEN WhatsApp Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: users
    description: User management
  - name: transactions
    description: Transaction management
  - name: announcements
    description: Public announcements
  - name: bot
    description: Bot status and control
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/check:
    get:
      operationId: adminCheck
      tags: [auth]
      summary: Check if admin session is valid
      responses:
        "200":
          description: Session valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCheckResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: getUsers
      tags: [users]
      summary: Get all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"

  /admin/users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/users/{id}/block:
    post:
      operationId: blockUser
      tags: [users]
      summary: Block or unblock a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/transactions:
    get:
      operationId: getTransactions
      tags: [transactions]
      summary: Get all transactions
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsListResponse"

  /admin/transactions/{id}/confirm:
    post:
      operationId: confirmTransaction
      tags: [transactions]
      summary: Confirm a transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTransactionRequest"
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/announcements:
    get:
      operationId: getAnnouncements
      tags: [announcements]
      summary: Get all announcements
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementsListResponse"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementResponse"

  /admin/announcements/{id}:
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete an announcement
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get WhatsApp bot status
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatusResponse"

  /admin/stats:
    get:
      operationId: getStats
      tags: [auth]
      summary: Get dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    AdminLoginRequest:
      type: object
      properties:
        phone:
          type: string
      required:
        - phone

    AdminLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        phone:
          type: string
      required:
        - success
        - token
        - phone

    AdminCheckResponse:
      type: object
      properties:
        valid:
          type: boolean
        phone:
          type: string
      required:
        - valid
        - phone

    User:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        name:
          type: string
        referralCode:
          type: string
        referredBy:
          type: string
          nullable: true
        balance:
          type: number
        ewalletType:
          type: string
          nullable: true
        ewalletNumber:
          type: string
          nullable: true
        ewalletName:
          type: string
          nullable: true
        isBlocked:
          type: boolean
        packageExpiry:
          type: string
          nullable: true
        lastCheckin:
          type: string
          nullable: true
        videosWatched:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - phone
        - name
        - referralCode
        - balance
        - isBlocked
        - videosWatched
        - createdAt

    UsersListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
      required:
        - users
        - total

    UserDetailResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        balance:
          type: number
        isBlocked:
          type: boolean
        ewalletType:
          type: string
        ewalletNumber:
          type: string
        ewalletName:
          type: string

    BlockUserRequest:
      type: object
      properties:
        blocked:
          type: boolean
      required:
        - blocked

    Transaction:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userPhone:
          type: string
        userName:
          type: string
        type:
          type: string
        amount:
          type: number
        status:
          type: string
        notes:
          type: string
          nullable: true
        proofUrl:
          type: string
          nullable: true
        packageDays:
          type: integer
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - userPhone
        - userName
        - type
        - amount
        - status
        - createdAt
        - updatedAt

    TransactionsListResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
      required:
        - transactions
        - total

    ConfirmTransactionRequest:
      type: object
      properties:
        action:
          type: string
          enum: [approve, reject]
        notes:
          type: string
      required:
        - action

    Announcement:
      type: object
      properties:
        id:
          type: integer
        message:
          type: string
        createdAt:
          type: string
      required:
        - id
        - message
        - createdAt

    AnnouncementsListResponse:
      type: object
      properties:
        announcements:
          type: array
          items:
            $ref: "#/components/schemas/Announcement"
      required:
        - announcements

    AnnouncementResponse:
      type: object
      properties:
        announcement:
          $ref: "#/components/schemas/Announcement"
      required:
        - announcement

    CreateAnnouncementRequest:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    BotStatusResponse:
      type: object
      properties:
        connected:
          type: boolean
        phone:
          type: string
          nullable: true
        qrCode:
          type: string
          nullable: true
        status:
          type: string
      required:
        - connected
        - status

    StatsResponse:
      type: object
      properties:
        totalUsers:
          type: integer
        activePackages:
          type: integer
        pendingTransactions:
          type: integer
        totalBalance:
          type: number
        todayCheckins:
          type: integer
      required:
        - totalUsers
        - activePackages
        - pendingTransactions
        - totalBalance
        - todayCheckins
